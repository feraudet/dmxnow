name: docs

on:
  push:
    paths: ["docs/**", "enclosure/board.json", "enclosure/out/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "enclosure/board.json", "enclosure/out/**", ".github/workflows/docs.yml"]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Figures up to date (generated from enclosure/board.json and SPEC values)
        run: |
          python3 docs/figures/make_figures.py
          git diff --exit-code -- docs/figures
      - name: Relative links and images
        run: python3 docs/tools/check_links.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagrams are PNG with their Mermaid source next to them
        run: |
          if grep -rln '```mermaid' --include='*.md' .; then
            echo "raw Mermaid in Markdown: render it to docs/diagrams/<name>.png"; exit 1
          fi
          for f in docs/diagrams/*.mmd; do
            [ -f "${f%.mmd}.png" ] || { echo "missing ${f%.mmd}.png"; exit 1; }
          done
          for f in docs/diagrams/*.png; do
            [ -f "${f%.png}.mmd" ] || { echo "missing ${f%.png}.mmd"; exit 1; }
          done
      - name: Mermaid sources parse
        run: |
          npm install --no-save @mermaid-js/mermaid-cli@11
          echo '{"args":["--no-sandbox"]}' > /tmp/pp.json
          for f in docs/diagrams/*.mmd; do
            npx mmdc -p /tmp/pp.json -i "$f" -o "/tmp/$(basename "$f" .mmd).svg"
          done
