name: firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  common:
    name: common (native tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/common
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Test vectors up to date (generated by an independent Python implementation)
        run: |
          python3 tools/gen_vectors.py
          git diff --stat --exit-code -- test_vectors.json
      - name: Native tests (SPEC 8.3)
        run: pio test -e native

  node:
    name: node (ESP32-C3 build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/node/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build (pioarduino 55.03.312)
        run: pio run -e node
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dmxnow-node-firmware
          path: |
            firmware/node/.pio/build/node/firmware.bin
            firmware/node/.pio/build/node/firmware.factory.bin

  dongle:
    name: dongle (XIAO ESP32-C3 build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/dongle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/dongle/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build (pioarduino 55.03.312)
        run: pio run -e dongle
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dmxnow-dongle-firmware
          path: |
            firmware/dongle/.pio/build/dongle/firmware.bin
            firmware/dongle/.pio/build/dongle/firmware.factory.bin
