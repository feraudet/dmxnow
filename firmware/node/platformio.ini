; dmxnow node firmware (SPEC 4.2, 4.5-4.9, PROTOCOL). ESP32-C3-MINI-1-N4, 4 MB flash.
;   pio run -e node            build
;   pio run -e node -t upload  flash through J3 (USB) - power J3-5V only, never J3-3V3
[platformio]
default_envs = node

[env:node]
; pioarduino, pinned: Arduino-ESP32 3.3.12 / ESP-IDF 5.5 (ADR 0011, V-FW-01)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
monitor_speed = 115200
lib_deps = symlink://../common
build_flags =
    -std=gnu++17
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDMXNOW_FW_MAJOR=1 -DDMXNOW_FW_MINOR=0 -DDMXNOW_FW_PATCH=0
build_unflags = -std=gnu++11
