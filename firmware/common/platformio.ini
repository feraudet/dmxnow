; firmware/common - host tests of the shared protocol library (SPEC 8.3)
;   pio test -e native
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall -Wextra -Werror
    -Iinclude
    -DVECTORS_PATH=\"$PROJECT_DIR/test_vectors.json\"
lib_deps =
    bblanchon/ArduinoJson@7.2.1
