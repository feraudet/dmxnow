; dmxnow dongle firmware (SPEC 4.10, PROTOCOL 8): Seeed XIAO ESP32-C3 on the Pi's USB.
;   pio run -e dongle            build
;   pio run -e dongle -t upload  flash (hold BOOT while plugging in the first time)
[platformio]
default_envs = dongle

[env:dongle]
; pioarduino, pinned like the node: Arduino-ESP32 3.3.12 / ESP-IDF 5.5 (ADR 0011, V-FW-01)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 921600
lib_deps = symlink://../common
build_flags =
    -std=gnu++17
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDMXNOW_FW_MAJOR=1 -DDMXNOW_FW_MINOR=0 -DDMXNOW_FW_PATCH=0
build_unflags = -std=gnu++11
